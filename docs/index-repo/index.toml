# The curated index of Swarmify Connector Packages. Format and how to add one: README.md.

[[packages]]
name = "blender_build"
description = "Writes a Blender project from the script in a sandboxed coding session, checking shots with stills, then renders it on the GPU."
git = "https://github.com/wagleanuj/swarmify.git"
subfolder = "connectors/blender_build"
ref = "main"
permissions = [
  "owned_folders: blender_templates",
  "capabilities: build_session",
  "capabilities: templates",
]

[[packages]]
name = "blender_render"
description = "Renders a Blender project's shots on the GPU, then its finish step, into one video."
git = "https://github.com/wagleanuj/swarmify.git"
subfolder = "connectors/blender_render"
ref = "main"
permissions = [
  "install_network: pypi.org",
  "install_network: files.pythonhosted.org",
  "install_network: download.blender.org",
  "install_network: github.com",
  "install_network: release-assets.githubusercontent.com",
  "folders: worlds/{world}/assets",
  "gpu: the host's graphics card",
  "owned_folders: blender_templates",
  "capabilities: templates",
]

[[packages]]
name = "hyperframes_build"
description = "Writes a HyperFrames project (HTML and GSAP) from the script in a sandboxed coding session, then renders it. Needs Node 22."
git = "https://github.com/wagleanuj/swarmify.git"
subfolder = "connectors/hyperframes_build"
ref = "main"
permissions = [
  "network: registry.npmjs.org",
  "network: fonts.googleapis.com",
  "network: fonts.gstatic.com",
  "network: cdn.jsdelivr.net",
  "prepare_network: registry.npmjs.org",
  "owned_folders: hyperframes_templates",
  "capabilities: build_session",
  "capabilities: templates",
]

[[packages]]
name = "hyperframes_render"
description = "Renders a script with the HyperFrames CLI. Needs Node 22 and a HyperFrames project."
git = "https://github.com/wagleanuj/swarmify.git"
subfolder = "connectors/hyperframes_render"
ref = "main"
permissions = [
  "network: localhost",
  "install_network: pypi.org",
  "install_network: files.pythonhosted.org",
  "install_network: registry.npmjs.org",
  "install_network: github.com",
  "install_network: release-assets.githubusercontent.com",
  "install_network: storage.googleapis.com",
  "prepare_network: registry.npmjs.org",
  "owned_folders: hyperframes_templates",
  "capabilities: templates",
]

[[packages]]

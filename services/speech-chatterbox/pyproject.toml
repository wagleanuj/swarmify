# Its own uv project, outside the Swarmify workspace: PyTorch and the models never enter the core
# (ADR 0019). `mise run speech` installs and starts it.
[project]
name = "speech-chatterbox"
version = "0.1.0"
description = "Chatterbox Turbo speech and faster-whisper word times over HTTP"
requires-python = ">=3.11,<3.13"
dependencies = [
  "chatterbox-tts==0.1.7",
  "faster-whisper>=1.2.1",
  "fastapi>=0.115",
  "python-multipart>=0.0.20",
  "soundfile>=0.13",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "uvicorn>=0.34",
  # faster-whisper 1.2 passes `metadata_errors` to av.open, which PyAV 19 dropped.
  "av<19",
  # Chatterbox's watermarker imports pkg_resources, which setuptools 81 removed.
  "setuptools<81",
]

[tool.uv]
package = false

# CPU wheels on Linux (the Compose profile); the default wheels there pull in CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

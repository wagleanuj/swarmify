# The Meta connector's own uv project, outside the Swarmify workspace: its install step syncs
# these into the installed version's folder (ADR 0026).
[project]
name = "swarmify-meta"
version = "1.0.0"
description = "Publishes Reels to Instagram and a Facebook Page through the Graph API"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx==0.28.1", "mcp==2.3.0"]

[tool.uv]
package = false

# The Upload-Post connector (README.md beside this file): our own small MCP server over
# Upload-Post's HTTP API (ADR 0015). A default package: Swarmify installs it from this folder and
# enables it for every world that has not decided otherwise.
name = "upload_post"
version = "1.0.0"
label = "Upload-Post"
about = "Posts or schedules a video to YouTube, TikTok and Instagram through Upload-Post."
kind = "publish"
stage_types = ["connector"]
capabilities = ["publish"]

runtime = "uv"
install = ["uv", "sync", "--frozen", "--no-dev"]
command = [".venv/bin/python", "upload_post.py"]

[params]
type = "object"
required = ["user"]
[params.properties.title]
type = "string"
description = "required unless metadata names a file an earlier stage produced whose frontmatter has title and description"
[params.properties.metadata]
type = "string"
description = "a file an earlier stage produced; its frontmatter's title, description, hashtags and tags win over these params"
[params.properties.description]
type = "string"
[params.properties.visibility]
enum = ["public", "unlisted", "private"]
default = "private"
[params.properties.schedule]
type = "string"
description = "ISO 8601 with a timezone, or 09:00, or +1d 09:00; needs public"
[params.properties.made_for_kids]
type = "boolean"
default = false
[params.properties.user]
type = "string"
description = "the Upload-Post profile"
[params.properties.platforms]
type = "array"
items = { type = "string" }
default = ["youtube"]
description = "where to post: youtube, tiktok, instagram"

[[inputs]]
description = "the video"
media_type = "video/mp4"

[setup]
test = "check_key"
help_url = "https://github.com/wagleanuj/swarmify/tree/main/connectors/upload_post#setup"

[[config]]
key = "api_key"
label = "API key"
type = "string"
secret = true
required = true
env = "UPLOAD_POST_API_KEY"
help = "From app.upload-post.com, under API keys."

[permissions]
network = ["api.upload-post.com"]

# The Remotion render connector (README.md beside this file). A default package: Swarmify installs
# it from this folder and enables it for every world that has not decided otherwise.
name = "remotion_render"
version = "1.0.3"
label = "Remotion render"
about = "Renders a script with the Remotion CLI. Needs Node and a Remotion project."
kind = "stage"
stage_types = ["connector"]

planner_notes = "Use it only when the operator has a finished template; else remotion_build makes the video. params.project is the name of one of the world's Remotion render Templates."

runtime = "uv"
# Its Python beside it (uv), then the Remotion CLI and the Chrome Headless Shell it downloads
# (ADR 0026), so a render needs nothing of the core image but Node, and Chrome for Testing, the
# browser that renders on a GPU (package.json's gpu-browser).
install = ["sh", "-c", "uv sync --frozen --no-dev && npm ci --ignore-scripts --no-audit --no-fund && npx --no remotion browser ensure && npm run gpu-browser"]
command = [".venv/bin/python", "remotion_render.py"]

# Its `project` is one of the world's Remotion Templates (ADR 0028), in the Owned Folder it
# shares with remotion_build, which a render reads in place and never writes.
capabilities = ["templates"]

# Its sandbox (ADR 0021). A render reaches only its own loopback (Remotion's server and the
# browser rendering it); a Template's folder is its Owned Folder, the build folder is the
# stage's. The install step reaches npm for the CLI and Remotion's host for Chrome Headless Shell
# (Google's storage where Remotion's own build does not fit the machine, and for Chrome for
# Testing). With the host's GPU a 3D scene renders about 10x faster than in software.
[permissions]
network = ["localhost"]
gpu = true
install_network = ["registry.npmjs.org", "remotion.media", "storage.googleapis.com"]

[[owned_folders]]
folder = "remotion_templates"
label = "Remotion templates"
about = "Projects a build starts from instead of the starter."

[templates]
folder = "remotion_templates"
require = ["package.json", "src/index.ts"]
prepare = ["npm", "ci"]
prepare_network = ["registry.npmjs.org"]

[params]
type = "object"
required = ["project", "composition"]
[params.properties.project]
type = "string"
description = "the Remotion project folder"
[params.properties.composition]
type = "string"
description = "the composition ID"
[params.properties.entry]
type = "string"
default = "src/index.ts"
[params.properties.codec]
type = "string"
default = "h264"
[params.properties.frames]
type = "string"
description = "a range, as 0-29"
[params.properties.props]
type = "object"
description = "the composition's input props"

[[inputs]]
description = "the script"
media_type = "text/markdown"

[[outputs]]
description = "the video"
media_type = "video/mp4"

[setup]
help_url = "https://github.com/wagleanuj/swarmify/tree/main/connectors/remotion_render#setup"

[[config]]
key = "concurrency"
label = "Render concurrency"
type = "string"
pattern = "[1-9][0-9]*%?"
env = "SWARMIFY_RENDER_CONCURRENCY"
help = "Browser tabs rendering at once in software, as 2 or 50%. Empty lets Remotion pick half the CPUs; with no GPU (Docker) a 3D scene renders in software and that many run out of memory, so set 2 there. On a GPU renders use one tab, since several sharing it drop frames."

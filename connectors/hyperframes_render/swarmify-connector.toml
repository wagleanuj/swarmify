# The HyperFrames render connector (README.md beside this file). Installed with Swarmify from this
# folder but not enabled by default: Remotion stays a world's video engine until it enables this.
name = "hyperframes_render"
version = "1.0.0"
label = "HyperFrames render"
about = "Renders a script with the HyperFrames CLI. Needs Node 22 and a HyperFrames project."
kind = "stage"
stage_types = ["connector"]
enable_by_default = false

runtime = "uv"
# Its Python beside it (uv), then the HyperFrames CLI, ffmpeg and ffprobe (ffmpeg.mjs: ffmpeg-static's
# release builds, each checked against a pinned SHA-256) and the Chrome Headless Shell HyperFrames
# downloads into its cache here (ADR 0026), so a render needs nothing of the core image but Node.
# --force downloads it even where a system Chrome would do. Where there is none to download (Linux
# arm64) the install still succeeds, so it is not repeated at every startup, and a render uses a
# Chrome Headless Shell on PATH or refuses saying to reinstall.
install = ["sh", "-c", "uv sync --frozen --no-dev && npm ci --ignore-scripts --no-audit --no-fund && npm run ffmpeg && { HYPERFRAMES_NO_TELEMETRY=1 HYPERFRAMES_CACHE_DIR=\"$PWD/node_modules/.hyperframes\" npx --no hyperframes browser ensure --force || echo 'no Chrome Headless Shell for this platform: put one on PATH'; }"]
command = [".venv/bin/python", "hyperframes_render.py"]

# Its sandbox (ADR 0021). A render reaches only its own loopback (HyperFrames' file server, on a
# port the OS hands out, and the browser rendering it); the project is in the run's folders. The
# install step reaches npm, GitHub's release downloads for ffmpeg and Google's storage for Chrome.
[permissions]
network = ["localhost"]
install_network = ["registry.npmjs.org", "github.com", "release-assets.githubusercontent.com", "storage.googleapis.com"]

[params]
type = "object"
required = ["project"]
[params.properties.project]
type = "string"
description = "the HyperFrames project folder"
[params.properties.composition]
type = "string"
default = "index.html"
description = "the composition file in the project"
[params.properties.quality]
type = "string"
enum = ["draft", "looks", "delivery", "standard", "high"]
[params.properties.fps]
type = "string"
description = "a frame rate, as 30 or 30000/1001"
[params.properties.variables]
type = "object"
description = "the composition's variables, beside script and scriptPath"

[[inputs]]
description = "the script"
media_type = "text/markdown"

[[outputs]]
description = "the video"
media_type = "video/mp4"

# The render connector's own uv project, outside the Swarmify workspace: its install step syncs
# these into the installed version's folder (ADR 0026).
[project]
name = "swarmify-hyperframes-render"
version = "1.0.0"
description = "Renders a script to a video with the HyperFrames CLI"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp==2.3.0"]

[tool.uv]
package = false

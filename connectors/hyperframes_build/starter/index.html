<!doctype html>
<!-- The render passes {script, scriptPath} as variables; read them with getVariables(). -->
<html
  lang="en"
  data-composition-variables='[
    {"id": "script", "type": "string", "label": "Script", "default": "# Swarmify"},
    {"id": "scriptPath", "type": "string", "label": "Script path", "default": ""}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- The render has no network: GSAP from the project's node_modules, never a CDN. -->
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #111;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        padding: 80px;
        font-family: sans-serif;
      }
      #title {
        color: #fff;
        font-size: 96px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="3" data-track-index="0"></h1>
    </div>
    <script>
      const { script } = window.__hyperframes.getVariables();
      const title = (script || "").split("\n").find((line) => line.trim()) || "Swarmify";
      document.querySelector("#title").textContent = title.replace(/^#+\s*/, "");
      const tl = gsap.timeline({ paused: true });
      tl.from("#title", { y: 60, duration: 0.6, ease: "power2.out" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

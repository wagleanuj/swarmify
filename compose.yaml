services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    environment:
      SWARMIFY_DATA_DIR: /data
      SWARMIFY_GRAPH_WRITER: external

  # The single writer of every world's graph (ADR 0003). Needs CLAUDE_CODE_OAUTH_TOKEN for
  # graphify's Claude CLI backend.
  graph-writer:
    build: .
    volumes:
      - data:/data
    environment:
      SWARMIFY_DATA_DIR: /data
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    command: ["swarmify-graph-writer"]
    healthcheck:
      disable: true

volumes:
  data:

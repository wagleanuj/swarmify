# The same file on the Mac and on a Debian VM: `docker compose up -d --build`, settings in `.env`
# next to it (README, Deployment). `web` serves the skin and proxies /api to `api`, so a UI-only
# change rebuilds and restarts only `web`. api and graph-writer share the one `data` volume.
x-env: &env
  SWARMIFY_DATA_DIR: /data
  # Headless Claude Code on the subscription: `claude setup-token` prints it (ADR 0010).
  # Checked per service by docker/needs.sh.
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}

services:
  # The only published port. Caddy with the built skin; sign-in stays the api's (Caddyfile).
  web:
    build: { context: ., target: web }
    ports:
      # The LAN sees it on every interface by default; SWARMIFY_BIND=127.0.0.1 keeps it local.
      - "${SWARMIFY_BIND:-0.0.0.0}:${SWARMIFY_PORT:-8000}:8000"
    restart: unless-stopped

  # Docker's default seccomp and AppArmor profiles: the api holds the Claude token, the sign-in
  # password and every Setup value, and starts no sandbox itself. Connector processes, install
  # steps and a Build Session's Claude CLI run in the `sandbox` service, over the socket.
  api:
    build: .
    init: true  # reaps the processes a connector leaves, as uvicorn as PID 1 would not
    volumes:
      - data:/data
      - sandbox-socket:/run/swarmify
    entrypoint: ["/app/docker/needs.sh", "CLAUDE_CODE_OAUTH_TOKEN", "SWARMIFY_PASSWORD", "--"]
    # A compose entrypoint clears the image's CMD, so the start command is repeated here.
    command: ["uvicorn", "--factory", "swarmify_api.main:create_app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      sandbox:
        condition: service_healthy  # it installs the default packages there on startup
    environment:
      <<: *env
      SWARMIFY_SANDBOX_RUNNER: /run/swarmify/sandbox.sock
      SWARMIFY_SANDBOX_CLI: /app/docker/claude-in-runner
      # The caches this repository's packages install with, where the sandbox service sees them
      UV_CACHE_DIR: /data/sandbox/cache/uv
      npm_config_cache: /data/npm-cache
      # Where a connector process reaches the api (a remote approver's MCP calls), from `sandbox`.
      SWARMIFY_INTERNAL_URL: http://api:8000
      SWARMIFY_GRAPH_WRITER: external
      # The operator's sign-in password (README, Sign-in), required, see entrypoint.
      SWARMIFY_PASSWORD: ${SWARMIFY_PASSWORD:-}
      SWARMIFY_BASE_URL: ${SWARMIFY_BASE_URL:-http://localhost:8000}
      # V1's speech engines: the first start of V2 carries this into the speech package's
      # Speech engines Setting (connectors/speech/README.md); after that the Setting counts.
      SPEECH_ENDPOINTS: ${SPEECH_ENDPOINTS:-http://host.docker.internal:8881,http://kokoro:8880}
    restart: unless-stopped

  # The connector sandbox (ADR 0021, issue 109): runs each connector process and install step
  # inside Anthropic's sandbox-runtime, and a Build Session's Claude CLI with its Bash sandbox
  # (ADR 0018). bubblewrap needs unprivileged user, mount, PID and network namespaces and a fresh
  # /proc, which Docker's defaults refuse, so this service alone gets the narrowest exceptions
  # that allow them: Docker's default seccomp profile plus those namespace syscalls
  # (docker/seccomp-sandbox.json), AppArmor off (docker-default denies every mount, a userns
  # one too; a host profile would have to be installed by hand), and /proc unmasked (the kernel
  # refuses a new proc mount over a masked one). It holds nothing at rest worth stealing: no
  # Claude token, password or setup.json, only the data folders the sandboxed processes use.
  sandbox:
    build: .
    init: true
    command: ["python", "-m", "swarmify_connectors.runner", "serve", "/run/swarmify/sandbox.sock"]
    security_opt:
      - seccomp=./docker/seccomp-sandbox.json
      - apparmor=unconfined
      - systempaths=unconfined
    volumes:
      - sandbox-socket:/run/swarmify
      # The same paths as in the api, which passes them: packages, the worlds' runs and assets,
      # Remotion templates, the npm cache of a Build Session and the sandbox's scratch folders.
      - { type: volume, source: data, target: /data/packages, volume: { subpath: packages } }
      - { type: volume, source: data, target: /data/worlds, volume: { subpath: worlds } }
      - { type: volume, source: data, target: /data/remotion, volume: { subpath: remotion } }
      - { type: volume, source: data, target: /data/npm-cache, volume: { subpath: npm-cache } }
      - { type: volume, source: data, target: /data/sandbox, volume: { subpath: sandbox } }
    environment:
      SWARMIFY_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "test", "-S", "/run/swarmify/sandbox.sock"]
      interval: 2s
    depends_on:
      folders:
        condition: service_completed_successfully
    restart: unless-stopped

  # Makes the data folders the sandbox service mounts, which must exist before it starts.
  folders:
    build: .
    volumes:
      - data:/data
    entrypoint: ["mkdir", "-p", "/data/packages", "/data/worlds", "/data/remotion", "/data/npm-cache", "/data/sandbox"]
    command: []
    healthcheck:
      disable: true
    restart: "no"

  # The single writer of every world's graph (ADR 0003), graphify on the Claude CLI backend.
  graph-writer:
    build: .
    volumes:
      - data:/data
    environment: *env
    entrypoint: ["/app/docker/needs.sh", "CLAUDE_CODE_OAUTH_TOKEN", "--"]
    command: ["swarmify-graph-writer"]
    healthcheck:
      disable: true
    restart: unless-stopped

# Named, so a package's own compose file (connectors/speech/compose.yaml) joins it and the api
# reaches its Services by name.
networks:
  default:
    name: swarmify

volumes:
  data:
  # The sandbox runner's socket, shared by the api and the sandbox service only.
  sandbox-socket:

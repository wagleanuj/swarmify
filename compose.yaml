# The same file on the Mac and on a Debian VM: `docker compose up -d --build`, settings in `.env`
# next to it (README, Deployment). Both services share the one `data` volume.
x-env: &env
  SWARMIFY_DATA_DIR: /data
  # Headless Claude Code on the subscription: `claude setup-token` prints it (ADR 0010).
  # Checked per service by docker/needs.sh, so `docker compose up kokoro` works without it.
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}

services:
  api:
    build: .
    ports:
      # The LAN sees it on every interface by default; SWARMIFY_BIND=127.0.0.1 keeps it local.
      - "${SWARMIFY_BIND:-0.0.0.0}:${SWARMIFY_PORT:-8000}:8000"
    volumes:
      - data:/data
    # bubblewrap sandboxes a remotion_build stage's Bash and render (ADR 0018): it needs user
    # namespaces and its own /proc, which Docker's default profiles refuse. Without these a
    # build stage fails rather than run unsandboxed.
    entrypoint: ["/app/docker/needs.sh", "CLAUDE_CODE_OAUTH_TOKEN", "SWARMIFY_PASSWORD", "--"]
    # A compose entrypoint clears the image's CMD, so the start command is repeated here.
    command: ["uvicorn", "--factory", "swarmify_api.main:create_app", "--host", "0.0.0.0", "--port", "8000"]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    environment:
      <<: *env
      SWARMIFY_GRAPH_WRITER: external
      SWARMIFY_USER: ${SWARMIFY_USER:-swarmify}
      SWARMIFY_PASSWORD: ${SWARMIFY_PASSWORD:-}  # required, see entrypoint
      SWARMIFY_BASE_URL: ${SWARMIFY_BASE_URL:-http://localhost:8000}
      # Speech engines in the order the speech connector tries them (README, Speech engines):
      # Chatterbox running natively on the Mac host, then Kokoro below.
      SPEECH_ENDPOINTS: ${SPEECH_ENDPOINTS:-http://host.docker.internal:8881,http://kokoro:8880}
    restart: unless-stopped

  # The single writer of every world's graph (ADR 0003), graphify on the Claude CLI backend.
  graph-writer:
    build: .
    volumes:
      - data:/data
    environment: *env
    entrypoint: ["/app/docker/needs.sh", "CLAUDE_CODE_OAUTH_TOKEN", "--"]
    command: ["swarmify-graph-writer"]
    healthcheck:
      disable: true
    restart: unless-stopped

  # Kokoro-FastAPI, the second speech engine (Apache 2.0, CPU). Bound to this host only: it has no
  # sign-in.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.1
    ports:
      - "127.0.0.1:8880:8880"
    restart: unless-stopped

  # Chatterbox Turbo on the CPU, for hosts without an Apple GPU: `docker compose --profile
  # chatterbox up -d` and SPEECH_ENDPOINTS=http://chatterbox:8881,http://kokoro:8880 in .env. On a
  # Mac run it natively instead (`mise run speech`) to use the GPU.
  chatterbox:
    profiles: [chatterbox]
    build: services/speech-chatterbox
    ports:
      - "127.0.0.1:8881:8881"
    volumes:
      - speech-models:/models
    restart: unless-stopped

volumes:
  data:
  speech-models:

# The same file on the Mac and on a Debian VM: `docker compose up -d --build`, settings in `.env`
# next to it (README, Deployment). `web` serves the skin and proxies /api to `api`, so a UI-only
# change rebuilds and restarts only `web`. api and graph-writer share the one `data` volume.
x-env: &env
  SWARMIFY_DATA_DIR: /data
  # Headless Claude Code on the subscription: `claude setup-token` prints it (ADR 0010).
  # Checked per service by docker/needs.sh.
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}

services:
  # The only published port. Caddy with the built skin; sign-in stays the api's (Caddyfile).
  web:
    build: { context: ., target: web }
    ports:
      # The LAN sees it on every interface by default; SWARMIFY_BIND=127.0.0.1 keeps it local.
      - "${SWARMIFY_BIND:-0.0.0.0}:${SWARMIFY_PORT:-8000}:8000"
    restart: unless-stopped

  api:
    build: .
    volumes:
      - data:/data
    # bubblewrap sandboxes a Build Session's Bash and render (ADR 0018): it needs user
    # namespaces and its own /proc, which Docker's default profiles refuse. Without these a
    # build stage fails rather than run unsandboxed.
    entrypoint: ["/app/docker/needs.sh", "CLAUDE_CODE_OAUTH_TOKEN", "SWARMIFY_PASSWORD", "--"]
    # A compose entrypoint clears the image's CMD, so the start command is repeated here.
    command: ["uvicorn", "--factory", "swarmify_api.main:create_app", "--host", "0.0.0.0", "--port", "8000"]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    environment:
      <<: *env
      SWARMIFY_GRAPH_WRITER: external
      # The operator's sign-in password (README, Sign-in), required, see entrypoint.
      SWARMIFY_PASSWORD: ${SWARMIFY_PASSWORD:-}
      SWARMIFY_BASE_URL: ${SWARMIFY_BASE_URL:-http://localhost:8000}
      # V1's speech engines: the first start of V2 carries this into the speech package's
      # Speech engines Setting (connectors/speech/README.md); after that the Setting counts.
      SPEECH_ENDPOINTS: ${SPEECH_ENDPOINTS:-http://host.docker.internal:8881,http://kokoro:8880}
    restart: unless-stopped

  # The single writer of every world's graph (ADR 0003), graphify on the Claude CLI backend.
  graph-writer:
    build: .
    volumes:
      - data:/data
    environment: *env
    entrypoint: ["/app/docker/needs.sh", "CLAUDE_CODE_OAUTH_TOKEN", "--"]
    command: ["swarmify-graph-writer"]
    healthcheck:
      disable: true
    restart: unless-stopped

# Named, so a package's own compose file (connectors/speech/compose.yaml) joins it and the api
# reaches its Services by name.
networks:
  default:
    name: swarmify

volumes:
  data:

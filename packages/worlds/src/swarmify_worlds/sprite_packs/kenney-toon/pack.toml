# The bundled sprite pack: Kenney Toon Characters (CC0, KENNEY-LICENSE.txt beside this file).
# Frames are 192 x 256 transparent PNGs, feet at bottom centre, one folder per character.
id = "kenney-toon"
name = "Toon Characters"
licence = "Creative Commons Zero (CC0 1.0): free to use in personal, educational and commercial projects. Crediting Kenney is welcome, not required."
author = "Kenney (www.kenney.nl)"
frame = [192, 256]

[room]
style = "cartoon"
poses_side = false


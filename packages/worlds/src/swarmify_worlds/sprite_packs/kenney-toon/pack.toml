# The default casting, by agent name or role. Invented names, no theme.
[casting.planner]
character = "femaleAdventurer"
name = "Mira"
colour = "#ffc93c"
catchphrase = "I have a plan. It has steps."

[casting."worker-1"]
character = "malePerson"
name = "Jun"
colour = "#7fd6ff"
catchphrase = "Rendered it twice for luck."

[casting."worker-2"]
character = "femalePerson"
name = "Priya"
colour = "#ff9ec7"
catchphrase = "Captions timed to the frame."

[casting."worker-3"]
character = "robot"
name = "Bolt"
colour = "#c6a8ff"
catchphrase = "BEEP. SOURCES ACQUIRED."

[casting.judge]
character = "maleAdventurer"
name = "Rex"
colour = "#ffa66b"
catchphrase = "Order! That one is an 8.4."

[casting.retro]
character = "zombie"
name = "Grave"
colour = "#9be38a"
catchphrase = "I dig up old runs so you don't repeat them."

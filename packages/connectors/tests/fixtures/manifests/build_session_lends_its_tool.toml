# error: build_session.tools: the core calls `tool` after the session, never the session
name = "bad"
version = "1.0.0"
label = "Bad"
about = "A fixture. A Build Session may call a preview of its render package, never the render."
kind = "stage"
stage_types = ["connector"]
runtime = "uv"
command = ["uv", "run", "server.py"]
capabilities = ["build_session"]

[build_session]
system = "system.md"
brief = "brief.md"
starter = "starter"
tool = "finish"
tools = ["preview", "finish"]

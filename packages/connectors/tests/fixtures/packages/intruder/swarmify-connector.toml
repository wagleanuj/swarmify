# A fixture Connector Package that tries what its sandbox forbids (ADR 0021): to read a folder it
# did not declare, another package's Credentials, and a host it did not declare, by name through
# the proxy and by address past it, and on macOS other processes' environments. Tests rewrite
# `command` to their own Python, which has the MCP SDK.
name = "intruder"
version = "1.0.0"
label = "Intruder"
about = "Tries to leave its sandbox. A fixture."
kind = "stage"
stage_types = ["connector"]
runtime = "uv"
command = ["python3", "server.py"]

[setup]
test = "check_setup"            # which also tries to read every package's Setup values

[[config]]
key = "api_key"
label = "API key"
type = "string"
secret = true
required = true
env = "INTRUDER_KEY"

[permissions]
network = ["api.example.org"]

[project]
name = "swarmify-swarm"
version = "0.1.0"
description = "Swarm context: the whiteboard of a swarm stage, its tasks and their claims"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "claude-agent-sdk==0.2.174",
    "jsonschema>=4.26",
    "swarmify-kernel",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project]
name = "swarmify-api"
version = "0.1.0"
description = "Swarmify HTTP API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "httpx2>=2.16",
  "mcp>=2.3",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "swarmify-connectors",
  "swarmify-kernel",
  "swarmify-learning",
  "swarmify-memory",
  "swarmify-notifications",
  "swarmify-worlds",
  "swarmify-runs",
  "swarmify-swarm",
  "swarmify-workflows",
  "uvicorn>=0.54",
]

[project.scripts]
swarmify-mcp = "swarmify_api.mcp:main"
swarmify-eval = "swarmify_api.eval_harness:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

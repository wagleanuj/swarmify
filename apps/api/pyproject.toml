[project]
name = "swarmify-api"
version = "0.1.0"
description = "Swarmify HTTP API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "mcp>=2.3",
  "swarmify-kernel",
  "swarmify-worlds",
  "swarmify-runs",
  "swarmify-workflows",
  "uvicorn>=0.54",
]

[project.scripts]
swarmify-mcp = "swarmify_api.mcp:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

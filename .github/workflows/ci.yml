name: CI

on:
  # Branches with a PR run once, as the pull_request; push runs only for main itself.
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: uv sync --locked --all-packages
      # The connector sandbox's launcher and Anthropic's sandbox-runtime it runs on (ADR 0021)
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python tools/check_imports.py packages
      # bubblewrap, socat and ripgrep for the OS sandbox every connector process and a Build
      # Session's Bash run in; Ubuntu keeps unprivileged user namespaces, which it needs, behind
      # AppArmor by default.
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --locked --all-packages
      - run: pnpm install --frozen-lockfile
      - run: uv run playwright install --with-deps chromium
      - run: mise run gen-client && git diff --exit-code apps/web/src/api/schema.d.ts
      # The connector sandbox, as above: the app installs its default packages and runs in it.
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: mise run e2e

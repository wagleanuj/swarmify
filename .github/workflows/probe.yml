# Temporary: probes the bubblewrap nested user namespace on the runners. Removed before merge.
on:
  push:
    branches: [fix-ci-linux-sandbox]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat ripgrep >/dev/null
          bwrap --version; uname -r; sysctl kernel.apparmor_restrict_unprivileged_userns
          ls /etc/apparmor.d | grep -i -E 'bwrap|userns'
          sudo aa-status | grep -i -E 'bwrap|userns'
          docker pull -q debian:bookworm-slim >/dev/null
          probe() {
            echo "== $1 host"; bwrap --unshare-user --unshare-pid --dev-bind / / --proc /proc unshare -U -r true && echo OK
            echo "== $1 docker"; docker run --rm --security-opt seccomp=./docker/seccomp-sandbox.json \
              --security-opt apparmor=unconfined --security-opt systempaths=unconfined debian:bookworm-slim \
              sh -c 'apt-get update -qq >/dev/null && apt-get install -y -qq bubblewrap >/dev/null 2>&1 && bwrap --unshare-user --unshare-pid --dev-bind / / --proc /proc unshare -U -r true && echo OK'
          }
          probe stock
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0; probe sysctl0
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=1
          [ -e /etc/apparmor.d/bwrap-userns-restrict ] && sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          probe profile
          true
